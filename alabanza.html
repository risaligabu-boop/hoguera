    'ALB-006': { nombre: 'Alex Fuentes', email: 'alexander.fg3@gmail.com', rol: 'miembro', categoria: 'musico', etiqueta: 'Piano · Apoyo temporal', rolesServicio: ['piano'], activo: true, puedeUsarPin: true },
    'ALB-007': { nombre: 'Músico por definir (acústica)', email: '', rol: 'miembro', categoria: 'musico', etiqueta: 'Guitarra acústica', rolesServicio: ['acustica'], activo: true, nombrePendiente: true },
    'ALB-008': { nombre: 'Músico por definir (eléctrica)', email: '', rol: 'miembro', categoria: 'musico', etiqueta: 'Guitarra eléctrica', rolesServicio: ['electrica'], activo: true, nombrePendiente: true },
    'ALB-009': { nombre: 'Músico por definir (bajo)', email: '', rol: 'miembro', categoria: 'musico', etiqueta: 'Bajo', rolesServicio: ['bajo'], activo: true, nombrePendiente: true },
    'ALB-010': { nombre: 'Músico por definir (batería)', email: '', rol: 'miembro', categoria: 'musico', etiqueta: 'Batería', rolesServicio: ['bateria'], activo: true, nombrePendiente: true },
    'USR-004': { nombre: 'Líder de Alabanza', email: 'cambiar-lider-alabanza@correo.com', rol: 'admin', categoria: null, etiqueta: 'Líder de alabanza', rolesServicio: [], activo: true, cuenta: true },
  };
  const roles = [
    ['dirige', 'Dirige', 'dirige', 'voz', 1, 1], ['coros', 'Coros', 'voces', 'voz', 3, 2], ['piano', 'Piano', 'musicos', 'musico', 1, 3],
    ['acustica', 'Guitarra Acústica', 'musicos', 'musico', 1, 4], ['electrica', 'Guitarra Eléctrica', 'musicos', 'musico', 1, 5],
    ['bajo', 'Bajo', 'musicos', 'musico', 1, 6], ['bateria', 'Batería', 'musicos', 'musico', 1, 7],
  ].map(([id, nombre, grupo, categoria, max, orden]) => ({ id, nombre, grupo, categoria, max, orden }));
  const grupos = [{ id: 'dirige', nombre: 'Dirige', orden: 1 }, { id: 'voces', nombre: 'Voces', orden: 2 }, { id: 'musicos', nombre: 'Músicos', orden: 3 }];
  const tipos = {
    domingo: { nombre: 'Servicio dominical', dia: 0, horarios: ['10:00'], roles: lista('dirige,coros,piano,acustica,electrica,bajo,bateria'), maxInstrumentos: null, ensayo: null },
    miercoles: { nombre: 'Hoguera Nights', dia: 3, horarios: ['19:00'], roles: lista('dirige,coros,piano,acustica'), maxInstrumentos: null, ensayo: null },
  };
  const canciones = {};
  [['Porque Bueno Es Dios', 'Jaime Murrell', 'UA2iO83iaas'], ['Danzaré', 'Averly Morillo', 'IBdGoJF068o'], ['Mi Gozo', 'Barak', 'IxD3JiOo9DY'],
    ['Glorifícate', 'Miel San Marcos', 'mywWiI6H8xc'], ['Señor Eres Fiel', 'Marco Barrientos', 'pkfmBLEVvNg'],
    ['Te Doy Gloria', 'En Espíritu y En Verdad', 'GPY_7xfdTu4'], ['Eres Digno de Adorar', 'CCINT', 'zIZ9H0Vj8vE'], ['Soy la Ofrenda', 'Montesanto', '7us5BqKyN-o']]
    .forEach(([titulo, artista, yt], i) => {
      canciones[`CAN-00${i + 1}`] = { titulo, artista, tono: '', tieneSecuencia: false, secuenciaUrl: '', refs: [`https://www.youtube.com/watch?v=${yt}`], archivada: false, tonosPorPersona: {}, secciones: [] };
    });
  const servicios = [];
  const ensayos = [];
  const participantes = (a) => [...new Set(Object.values(a).flat())];
  const nuevoSvc = (fechaISO, tipo, hora, asignaciones, programa = [], notas = '') =>
    servicios.push({ id: `${fechaISO}_${tipo}_${hora.replace(':', '')}`, fechaISO, hora, tipo, notas, ensayoId: null, asignaciones, participantes: participantes(asignaciones), programa });
  const domingo = () => ({ dirige: ['ALB-001'], coros: ['ALB-003', 'ALB-004'], piano: ['ALB-006'], acustica: ['ALB-007'], electrica: ['ALB-008'], bajo: ['ALB-009'], bateria: ['ALB-010'] });
  for (let f = '2026-10-21'; f <= '2026-12-30'; f = sumarDias(f, 7)) nuevoSvc(f, 'miercoles', '19:00', { dirige: ['ALB-001'], coros: ['ALB-002'], acustica: ['ALB-005'] });
  nuevoSvc('2026-10-25', 'domingo', '10:00', domingo(), [
    ['CAN-001', 'ALB-001', 1, ''], ['CAN-002', 'ALB-001', 1, ''], ['CAN-003', 'ALB-003', 1, ''], ['CAN-004', 'ALB-001', 1, ''],
    ['CAN-005', 'ALB-001', 2, ''], ['CAN-006', 'ALB-004', 2, ''], ['CAN-007', 'ALB-001', 2, ''], ['CAN-008', 'ALB-001', 2, 'Nueva'],
  ].map(([cancionId, dirige, bloque, nota], i) => ({ cancionId, orden: i + 1, tono: '', refs: [], dirige, bloque, nota })), 'Primer servicio presencial');
  nuevoSvc('2026-11-29', 'domingo', '10:00', domingo(), [], 'Fecha tentativa — confirmar el domingo del mes');
  nuevoSvc('2026-12-27', 'domingo', '10:00', domingo(), [], 'Fecha tentativa — confirmar el domingo del mes');

  const clon = (o) => JSON.parse(JSON.stringify(o));
  return {
    async get(action) {
      await espera();
      if (action !== 'alabanza_base') throw new Error('Acción no reconocida');
      if (!token()) throw new Error('Sesión inválida o expirada');
      return clon({
        uid: 'ALB-006', me: { ...usuarios['ALB-006'], rol: 'superadmin' }, usuarios, hoguera: true,
        grupos, roles, tipos, canciones, servicios, ensayos, hoy: new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()),
      });
    },
    async post(action, p) {
      await espera();
      if (action === 'login_solicitar_codigo' || action === 'logout' || action === 'definir_pin') return { ok: true };
      if (action === 'login_verificar_codigo' || action === 'login_pin') {
        if ((p.codigo ?? p.pin) !== '123456') throw new Error('Código incorrecto o vencido.');
        return { token: 'demo' };
      }
      if (action === 'alb_guardar_servicio') {
        const F = p.servicio; const t = tipos[F.tipo];
        const horas = !F.idOriginal && F.ambos && t.horarios.length > 1 ? t.horarios : [F.hora];
        const asig = Object.fromEntries(Object.entries(F.asignaciones).filter(([r, ids]) => t.roles.includes(r) && ids.length));
        const ids = horas.map((h) => `${F.fechaISO}_${F.tipo}_${h.replace(':', '')}`);
        ids.forEach((id) => { if (id !== F.idOriginal && servicios.some((s) => s.id === id)) throw new Error('Ya existe ese culto.'); });
        if (F.idOriginal) servicios.splice(servicios.findIndex((s) => s.id === F.idOriginal), 1);
        horas.forEach((h) => nuevoSvc(F.fechaISO, F.tipo, h, clon(asig), clon(F.programa), F.notas.trim()));
        return { ids };
      }
      if (action === 'alb_eliminar_servicio') { servicios.splice(servicios.findIndex((s) => s.id === p.id), 1); return { id: p.id }; }
      if (action === 'alb_guardar_programa') { p.destinos.forEach((id) => { servicios.find((s) => s.id === id).programa = clon(p.programa); }); return { ok: true }; }
      if (action === 'alb_guardar_cancion') {
        let id = p.id;
        if (!id) { id = `CAN-${String(Object.keys(canciones).length + 1).padStart(3, '0')}`; canciones[id] = { tonosPorPersona: {}, secciones: [] }; }
        const c = canciones[id];
        const { tonosPorPersona, ...resto } = p.datos;
        Object.assign(c, resto);
        if (tonosPorPersona) Object.assign(c.tonosPorPersona, tonosPorPersona);
        if (p.quitarTono) delete c.tonosPorPersona[p.quitarTono];
        return { id, cancion: clon(c) };
      }
      if (action === 'alb_guardar_persona') {
        const id = p.id || `ALB-${String(Object.keys(usuarios).length + 1).padStart(3, '0')}`;
        usuarios[id] = { ...(usuarios[id] ?? {}), ...p.datos, nombrePendiente: false };
        return { id };
      }
      if (action === 'alb_guardar_ensayo') return { ok: true };
      throw new Error('Acción no reconocida');
    },
  };
})();

arrancar();

// Sesión: token compartido con el panel de Hoguera (localStorage)
async function salir() {
  const t = token();
  guardarPref(LS_TOKEN, '');
  try { localStorage.removeItem(LS_TOKEN); } catch {}
  if (t) apiPost('logout', { token: t }).catch(() => {});
  closeSheet();
  L.paso = 'email'; renderLogin(); mostrar('login');
  toast('Sesión cerrada');
}

async function arrancar() {
  const inicio = Date.now();
  if (!token()) {
    await sleep(Math.max(0, 900 - (Date.now() - inicio))); // que se aprecie el logo
    L.paso = 'email'; renderLogin(); mostrar('login'); return;
  }
  $('#loader').classList.remove('out');
  try {
    S.meses.clear();
    await cargarBase();
    await sleep(Math.max(0, 900 - (Date.now() - inicio)));
    closeSheet();
    renderTopbar();
    renderInicio();
    mostrar('app');
    const guardada = leerPref('vista');
    await irA(VISTAS.some((v) => v.id === guardada) ? guardada : 'inicio');
  } catch (err) {
    console.warn(err);
    try { localStorage.removeItem(LS_TOKEN); } catch {}
    L.paso = 'email'; renderLogin(); mostrar('login');
    toast(/Sesión/.test(err.message) ? 'Tu sesión venció. Entra de nuevo.' : err.message, true);
  }
}
